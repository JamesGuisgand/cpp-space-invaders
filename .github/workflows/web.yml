name: Build browser edition
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t space-invaders-web .
      - run: docker compose config --quiet
      - name: Serve and check the HTTP response
        run: |
          docker run -d --name invaders-test -p 127.0.0.1:8000:80 space-invaders-web

          for attempt in {1..20}; do
            if curl -fsS --max-time 2 -o "$RUNNER_TEMP/invaders.html" http://127.0.0.1:8000/; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              docker logs invaders-test
              exit 1
            fi
            sleep 1
          done

          grep -F 'Graphique ++' "$RUNNER_TEMP/invaders.html"
          curl -fsSI --max-time 5 http://127.0.0.1:8000/engine.wasm |
            tr -d '\r' | grep -i '^Content-Type: application/wasm$'
