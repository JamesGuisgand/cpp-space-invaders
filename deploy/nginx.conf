server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location = /engine.wasm {
        types { application/wasm wasm; }
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
